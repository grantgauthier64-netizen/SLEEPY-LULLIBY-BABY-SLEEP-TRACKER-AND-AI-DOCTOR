    <!-- Inline error handler to prevent benign Vite websocket / HMR unhandled rejection notices -->
    <script>
      (function() {
        function isViteWsError(err) {
          if (!err) return false;
          var str = '';
          try {
            str = (err.message || err.stack || err.reason || String(err)).toLowerCase();
          } catch(e) {}
          return (
            str.indexOf('websocket') !== -1 ||
            str.indexOf('closed without opened') !== -1 ||
            str.indexOf('failed to connect to websocket') !== -1 ||
            str.indexOf('failed to fetch dynamically imported module') !== -1
          );
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (isViteWsError(event.reason) || isViteWsError(event)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            return false;
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isViteWsError(event.error) || isViteWsError(event.message) || isViteWsError(event)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            return false;
          }
        }, true);
      })();
    </script>
